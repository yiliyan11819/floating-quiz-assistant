appId: com.floatquiz.helper
# ⚠️ 必须是 ASCII，别改成中文。
# productName 会变成主程序的文件名（win-unpacked/<productName>.exe）。electron-builder
# 生成 NSIS 脚本时，非 ASCII 的可执行文件名会被弄坏，结果**主程序根本没被打进
# 免安装 exe 的载荷里**（载荷里只剩 app.asar 和一堆 dll），产物看着有 70 多 MB、
# 双击却什么都起不来 —— NSIS 启动器解压完找不到可执行文件，静默退出且返回码是 0。
# 界面上想显示中文，靠窗口标题 / 托盘 tooltip 就够了，不受这里影响。
#
# 另外：数据目录不受 productName 影响 —— 那是 app.getName()，取打包后
# package.json 的 name，electron-builder 不会改它，所以恒为 %APPDATA%\float-quiz-helper。
productName: FloatQuiz
copyright: Copyright © 2026 float-quiz-helper contributors

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

# 运行时不依赖任何 node_modules（主进程与渲染层均已用 esbuild 打包）
asar: true
compression: maximum

win:
  icon: build/icon.ico
  target:
    - target: portable
      arch:
        - x64
  artifactName: FloatQuizHelper-${version}-portable.exe

portable:
  # 免安装：双击即用，运行时不弹 UAC、不写注册表
  requestExecutionLevel: user
  unpackDirName: FloatQuizHelper
