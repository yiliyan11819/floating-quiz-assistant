<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>框选区域</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <!-- 冻结的屏幕画面：框选期间用它当背景，避免透明窗口把视频挤黑 -->
    <div id="backdrop"></div>

    <div id="dim"></div>

    <div id="sel" class="sel hidden">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>
      <span id="sizeLabel" class="size-label"></span>
    </div>

    <div id="crosshairX" class="crosshair hidden"></div>
    <div id="crosshairY" class="crosshair hidden"></div>

    <div class="hint" id="hint">
      <span class="hint-icon">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <path
            d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
          <circle cx="12" cy="12" r="2.4" fill="currentColor" />
        </svg>
      </span>
      <span id="hintText">拖拽框选区域</span>
      <span class="hint-key">ESC 取消</span>
    </div>

    <script src="overlay.js"></script>
  </body>
</html>
