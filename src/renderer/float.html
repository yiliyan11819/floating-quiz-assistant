<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:;"
    />
    <title>浮窗刷题助手</title>
    <link rel="stylesheet" href="vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="float.css" />
  </head>
  <body>
    <!-- 折叠后的小胶囊 -->
    <button id="capsule" class="capsule hidden" title="展开浮窗">
      <span class="capsule-dot" id="capsuleDot"></span>
      <span class="capsule-icon">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path
            d="M13 2 4.5 13.2h6L9.8 22 19 10.6h-6.4z"
            fill="currentColor"
          />
        </svg>
      </span>
    </button>

    <section id="card" class="card">
      <header id="titlebar">
        <span class="logo">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
            <path d="M13 2 4.5 13.2h6L9.8 22 19 10.6h-6.4z" fill="currentColor" />
          </svg>
        </span>
        <span class="appname">浮窗刷题助手</span>
        <span id="status" class="badge">待机</span>
        <span class="flex-1"></span>

        <button id="btnSettings" class="iconbtn nodrag" title="设置">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
            <path
              d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm7.4-2.2.1-.9-.1-.9 1.7-1.3-1.7-2.9-2 .8a7 7 0 0 0-1.6-.9L15.5 5h-3.4l-.3 2.2a7 7 0 0 0-1.6.9l-2-.8-1.7 2.9L8.2 11.5l-.1.9.1.9-1.7 1.3 1.7 2.9 2-.8c.5.4 1 .7 1.6.9l.3 2.2h3.4l.3-2.2c.6-.2 1.1-.5 1.6-.9l2 .8 1.7-2.9-1.7-1.3Z"
              fill="currentColor"
            />
          </svg>
        </button>
        <button id="btnNotebook" class="iconbtn nodrag" title="错题本">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
            <path
              d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm2 0v18M4 8h4M4 12h4M4 16h4"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <button id="btnCollapse" class="iconbtn nodrag" title="折叠成小胶囊">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
            <path d="M6 12h12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
        <button id="btnHide" class="iconbtn nodrag danger" title="隐藏到系统托盘">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
            <path
              d="M6 6l12 12M18 6 6 18"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </header>

      <nav class="modes nodrag" id="modes">
        <button data-mode="manual" class="active">手动</button>
        <button data-mode="auto">自动</button>
        <button data-mode="shot">截图</button>
      </nav>

      <div id="hintbar" class="hintbar hidden"></div>

      <main id="answer" class="answer">
        <div class="empty" id="empty">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
              <path
                d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v13A1.5 1.5 0 0 1 18.5 20h-13A1.5 1.5 0 0 1 4 18.5v-13Z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
              />
              <path
                d="M8 9h8M8 12.5h8M8 16h4.5"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <p class="empty-title">还没有识别到题目</p>
          <p class="empty-sub" id="emptySub">
            按 <b>识别本页</b> 直接读当前区域，或按 <b id="hotkeyText">Ctrl + Shift + A</b> 框选题目
          </p>
          <div id="setupTip" class="setup-tip hidden">
            还没有填 API Key
            <button id="btnGoSettings" class="primary small">去设置</button>
          </div>
        </div>
      </main>

      <footer>
        <div class="actions nodrag">
          <button id="btnSolve" class="primary">识别本页</button>
          <button id="btnPause" class="hidden">暂停</button>
          <button id="btnReanswer" class="hidden">重新回答</button>
          <button id="btnCancel" class="hidden">停止</button>
          <button id="btnCollect" class="ghost" title="把当前这道题收进错题本（不用先追问）">
            ☆ 收藏
          </button>
          <select id="collectCat" class="cat-select" title="收藏到哪个分类"></select>
          <input
            id="newCat"
            class="cat-input hidden"
            type="text"
            maxlength="24"
            placeholder="分类名，回车确认"
            title="输入新的分类名，回车确认（Esc 取消）"
          />
          <span class="flex-1"></span>
          <span id="meta" class="meta"></span>
        </div>
        <div class="ask nodrag">
          <textarea
            id="ask"
            rows="1"
            placeholder="追问：为什么选 B / 换个方法讲（Enter 发送，Shift+Enter 换行）"
          ></textarea>
          <button id="btnSend" title="发送">发送</button>
        </div>
      </footer>

      <!-- 选中答案里的文字时浮现：一键把这段引用进追问框 -->
      <button id="quoteBtn" class="quote-btn hidden" title="把选中的内容引用到追问框">
        ↩ 引用到追问
      </button>

      <div id="grip" class="grip nodrag" title="拖动调整大小"></div>
    </section>

    <script src="float.js"></script>
  </body>
</html>
